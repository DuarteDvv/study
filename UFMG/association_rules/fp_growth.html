
<style>
:root {
  --font-sans: "IBM Plex Sans", "Source Sans 3", "Noto Sans", sans-serif;
  --color-background-primary: #ffffff;
  --color-background-secondary: #f6f7f9;
  --color-background-info: #e9f2ff;
  --color-background-success: #e9f7ef;
  --color-background-warning: #fff5e6;
  --color-text-primary: #1a1d21;
  --color-text-secondary: #5b6067;
  --color-text-tertiary: #8a9098;
  --color-text-info: #0b4ea2;
  --color-text-success: #1f7a4d;
  --color-text-warning: #a25c00;
  --color-border-secondary: #d7dbe0;
  --color-border-tertiary: #e3e6ea;
  --color-border-info: #b6d0f4;
  --color-border-success: #b8e1c7;
  --color-border-warning: #f7d2a6;
  --border-radius-md: 10px;
  --border-radius-lg: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); background: #ffffff; color: var(--color-text-primary); }
#fp-root { padding: 1rem 0; }
.phase-bar { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:1.5rem; }
.phase-pill { padding:5px 14px; border-radius:20px; font-size:12px; cursor:pointer; border:0.5px solid var(--color-border-secondary); color:var(--color-text-secondary); background:var(--color-background-secondary); transition:all .2s; }
.phase-pill.active { background:var(--color-background-info); color:var(--color-text-info); border-color:var(--color-border-info); font-weight:500; }

.step-header { display:flex; align-items:center; gap:12px; margin-bottom:1rem; }
.step-badge { width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;flex-shrink:0;background:var(--color-background-info);color:var(--color-text-info); }
.step-title { font-size:16px; font-weight:500; color:var(--color-text-primary); }
.step-subtitle { font-size:13px; color:var(--color-text-secondary); margin-top:2px; }

.card { background:var(--color-background-primary); border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-lg); padding:1rem 1.25rem; margin-bottom:1rem; }
.card-label { font-size:11px; font-weight:500; color:var(--color-text-tertiary); letter-spacing:.04em; text-transform:uppercase; margin-bottom:.75rem; }

.db-table { width:100%; border-collapse:collapse; font-size:13px; }
.db-table th { font-weight:500; font-size:11px; color:var(--color-text-tertiary); text-align:left; padding:4px 8px; border-bottom:0.5px solid var(--color-border-tertiary); }
.db-table td { padding:5px 8px; color:var(--color-text-primary); border-bottom:0.5px solid var(--color-border-tertiary); transition:background .3s; }
.db-table tr.highlight td { background:var(--color-background-info); }

.item-chip { display:inline-block; padding:2px 8px; border-radius:12px; font-size:11px; font-weight:500; margin:1px; }
.chip-bread  { background:#E6F1FB; color:#0C447C; }
.chip-milk   { background:#EAF3DE; color:#27500A; }
.chip-eggs   { background:#FAEEDA; color:#633806; }
.chip-butter { background:#FBEAF0; color:#72243E; }
.chip-coffee { background:#EEEDFE; color:#3C3489; }
.chip-sugar  { background:#FAEEda; color:#854F0B; }

.support-bar-wrap { display:flex; align-items:center; gap:8px; margin:4px 0; }
.support-bar-label { font-size:12px; color:var(--color-text-primary); width:56px; flex-shrink:0; }
.support-bar { height:16px; border-radius:4px; transition:width .6s cubic-bezier(.4,0,.2,1); display:flex;align-items:center;padding-left:6px; font-size:10px; font-weight:500; }
.support-count { font-size:12px; color:var(--color-text-secondary); }
.eliminated { opacity:.35; text-decoration:line-through; }

.tree-svg-wrap { overflow:visible; }

.nav-row { display:flex; gap:8px; align-items:center; margin-top:1rem; }
.btn { padding:6px 16px; border-radius:var(--border-radius-md); border:0.5px solid var(--color-border-secondary); background:transparent; cursor:pointer; font-size:13px; color:var(--color-text-primary); transition:background .15s; }
.btn:hover { background:var(--color-background-secondary); }
.btn.primary { background:var(--color-background-info); color:var(--color-text-info); border-color:var(--color-border-info); }
.btn:disabled { opacity:.4; cursor:not-allowed; }
.step-counter { font-size:12px; color:var(--color-text-tertiary); margin-left:auto; }

.callout { border-left:3px solid var(--color-border-info); background:var(--color-background-info); border-radius:0 var(--border-radius-md) var(--border-radius-md) 0; padding:.75rem 1rem; font-size:13px; color:var(--color-text-info); margin-bottom:1rem; }
.callout.success { border-color:var(--color-border-success); background:var(--color-background-success); color:var(--color-text-success); }
.callout.warn { border-color:var(--color-border-warning); background:var(--color-background-warning); color:var(--color-text-warning); }

.result-chip { display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:12px; font-size:12px; font-weight:500; border:0.5px solid var(--color-border-secondary); margin:3px; background:var(--color-background-secondary); color:var(--color-text-primary); }
.result-chip .sup { font-size:10px; color:var(--color-text-secondary); }

.anim-node { transition: opacity .4s, transform .4s; }
.anim-node.hidden { opacity:0; pointer-events:none; }

.two-col { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media(max-width:500px){.two-col{grid-template-columns:1fr;}}

.t-header { display:flex; gap:4px; align-items:center; justify-content:space-between; font-size:12px; color:var(--color-text-secondary); margin-bottom:8px; }
.ordered-item { display:flex; align-items:center; gap:8px; padding:5px 8px; border-radius:6px; font-size:12px; margin:3px 0; border:0.5px solid var(--color-border-tertiary); }
.ordered-item .rank { width:18px; height:18px; border-radius:50%; background:var(--color-background-secondary); display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:500; }

.path-highlight { animation: pathpulse 1s ease-in-out infinite alternate; }
@keyframes pathpulse { from{opacity:.5} to{opacity:1} }

#step-content { min-height:300px; }
.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
</style>

<div id="fp-root">
<h2 class="sr-only">Visualização passo a passo do algoritmo FP-Growth</h2>

<div class="phase-bar" id="phase-bar"></div>

<div id="step-content"></div>

<div class="nav-row">
  <button class="btn" id="btn-prev" onclick="navigate(-1)">← Anterior</button>
  <button class="btn primary" id="btn-next" onclick="navigate(1)">Próximo →</button>
  <span class="step-counter" id="step-counter"></span>
</div>
</div>

<script>
const DB = [
  {id:'T1', items:['Pão','Leite','Manteiga','Ovos']},
  {id:'T2', items:['Pão','Leite','Café']},
  {id:'T3', items:['Pão','Ovos','Manteiga']},
  {id:'T4', items:['Leite','Ovos','Manteiga']},
  {id:'T5', items:['Pão','Leite']},
  {id:'T6', items:['Pão','Café','Açúcar']},
  {id:'T7', items:['Leite','Manteiga']},
  {id:'T8', items:['Pão','Leite','Ovos']},
];
const MIN_SUP = 3;
const CHIP = {Pão:'chip-bread',Leite:'chip-milk',Ovos:'chip-eggs',Manteiga:'chip-butter',Café:'chip-coffee',Açúcar:'chip-sugar'};
const COLORS = {Pão:'#185FA5',Leite:'#3B6D11',Ovos:'#854F0B',Manteiga:'#993556',Café:'#534AB7'};

function chip(item){return `<span class="item-chip ${CHIP[item]||''}">${item}</span>`;}
function chips(arr){return arr.map(chip).join('');}
function displayPrefix(items){
  return items.length ? chips(items) : `<span style="color:var(--color-text-tertiary)">∅</span>`;
}

const freqMap={Pão:6,Leite:6,Ovos:4,Manteiga:4,Café:2,Açúcar:1};
const ORDER=['Pão','Leite','Ovos','Manteiga','Café','Açúcar'];
const FREQUENT=['Pão','Leite','Ovos','Manteiga'];
const ORDERED_TXS=DB.map(t=>({...t, ordered:t.items.filter(i=>FREQUENT.includes(i)).sort((a,b)=>ORDER.indexOf(a)-ORDER.indexOf(b))}));

const COND_MANTEIGA_PREFIXES=[
  {items:['Pão','Leite','Ovos'], weight:1},
  {items:['Pão','Ovos'], weight:1},
  {items:['Leite','Ovos'], weight:1},
  {items:['Leite'], weight:1},
];
const COND_MANTEIGA_SUPPORT={Leite:3,Ovos:3,Pão:2};
const COND_MANTEIGA_FREQUENT=['Leite','Ovos'];
const COND_MANTEIGA_ORDER=['Leite','Ovos'];
const COND_MANTEIGA_ORDERED=COND_MANTEIGA_PREFIXES.map(p=>({
  ...p,
  ordered:p.items.filter(i=>COND_MANTEIGA_FREQUENT.includes(i))
    .sort((a,b)=>COND_MANTEIGA_ORDER.indexOf(a)-COND_MANTEIGA_ORDER.indexOf(b))
}));

const COND_MANTEIGA_OVOS_PREFIXES=[
  {items:['Leite'], weight:3},
  {items:[], weight:1},
];
const COND_MANTEIGA_OVOS_SUPPORT={Leite:3};
const COND_MANTEIGA_OVOS_FREQUENT=['Leite'];
const COND_MANTEIGA_OVOS_ORDER=['Leite'];
const COND_MANTEIGA_OVOS_ORDERED=COND_MANTEIGA_OVOS_PREFIXES.map(p=>({
  ...p,
  ordered:p.items.filter(i=>COND_MANTEIGA_OVOS_FREQUENT.includes(i))
    .sort((a,b)=>COND_MANTEIGA_OVOS_ORDER.indexOf(a)-COND_MANTEIGA_OVOS_ORDER.indexOf(b))
})).filter(p=>p.ordered.length>0);

const COND_MANTEIGA_LEITE_PREFIXES=[
  {items:[], weight:3},
];

let stepIdx=0;

const STEPS=[
  // Step 0: Intro
  {phase:'Visão geral', title:'O problema: encontrar padrões frequentes', subtitle:'Por que o FP-Growth é melhor que o Apriori?',
  render:()=>`
    <div class="card">
      <div class="card-label">Banco de dados — ${DB.length} transações, min_support = ${MIN_SUP}</div>
      <table class="db-table">
        <tr><th>Transação</th><th>Itens</th></tr>
        ${DB.map(t=>`<tr><td style="color:var(--color-text-secondary);font-size:12px">${t.id}</td><td>${chips(t.items)}</td></tr>`).join('')}
      </table>
    </div>
    <div class="two-col">
      <div class="card">
        <div class="card-label">Apriori (legado)</div>
        <div style="font-size:13px;color:var(--color-text-secondary);line-height:1.7">
          <div>❌ Lê o banco <strong style="color:var(--color-text-primary)">muitas vezes</strong></div>
          <div>❌ Gera <strong style="color:var(--color-text-primary)">milhões de candidatos</strong></div>
          <div>❌ Estouros de memória</div>
        </div>
      </div>
      <div class="card" style="border-color:var(--color-border-success)">
        <div class="card-label">FP-Growth (moderno)</div>
        <div style="font-size:13px;color:var(--color-text-secondary);line-height:1.7">
          <div>✅ Lê o banco só <strong style="color:var(--color-text-primary)">2 vezes</strong></div>
          <div>✅ <strong style="color:var(--color-text-primary)">Nenhum candidato</strong> gerado</div>
          <div>✅ Comprime dados em árvore</div>
        </div>
      </div>
    </div>
    <div class="callout">Objetivo: encontrar todos os conjuntos de itens que aparecem juntos em pelo menos ${MIN_SUP} transações.</div>
  `},

  // Step 1: Scan 1 — count
  {phase:'Scan 1', title:'Varredura 1 — contar suporte individual', subtitle:'Descobrir quais itens passam do min_support',
  render:()=>`
    <div class="callout">Percorremos o banco UMA vez e contamos quantas vezes cada item aparece.</div>
    <div class="card">
      <div class="card-label">Contagem de suporte (min_support = ${MIN_SUP})</div>
      ${ORDER.map(item=>{
        const sup=freqMap[item];
        const ok=sup>=MIN_SUP;
        const pct=Math.round(sup/DB.length*100);
        return `<div class="support-bar-wrap ${ok?'':'eliminated'}">
          <span class="support-bar-label">${chip(item)}</span>
          <div class="support-bar" style="width:${pct*3}px;background:${ok?'#B5D4F4':'#D3D1C7'};color:${ok?'#0C447C':'#5F5E5A'}">${sup}/${DB.length}</div>
          <span class="support-count">${ok?'✅ frequente':'❌ raro, eliminado'}</span>
        </div>`;
      }).join('')}
    </div>
    <div class="callout warn">Café (2) e Açúcar (1) estão abaixo do mínimo ${MIN_SUP} → eliminados de todas as transações.</div>
  `},

  // Step 2: Sort table T
  {phase:'Scan 1', title:'Tabela T — itens ordenados por suporte', subtitle:'Maior suporte primeiro — a chave da eficiência',
  render:()=>`
    <div class="callout">Os sobreviventes são ordenados do maior suporte para o menor. Esta ordem garante que a árvore seja comprimida ao máximo.</div>
    <div class="card" style="max-width:340px">
      <div class="card-label">Tabela T (itens frequentes, ordenados)</div>
      <div class="t-header"><span>Rank</span><span>Item</span><span>Suporte</span></div>
      ${FREQUENT.map((item,i)=>`<div class="ordered-item">
        <div class="rank">${i+1}</div>
        ${chip(item)}
        <span style="margin-left:auto;font-size:12px;font-weight:500;color:var(--color-text-primary)">${freqMap[item]}</span>
        <div style="height:8px;width:${freqMap[item]*16}px;background:#B5D4F4;border-radius:4px"></div>
      </div>`).join('')}
    </div>
    <div class="callout success">Esta tabela será usada para ordenar os itens de CADA transação antes de inserir na árvore.</div>
  `},

  // Step 3: Scan 2 intro
  {phase:'Scan 2', title:'Varredura 2 — reordenar transações', subtitle:'Cada transação tem seus itens filtrados e ordenados pela Tabela T',
  render:()=>`
    <div class="callout">Segunda e ÚLTIMA leitura do banco. Para cada transação: (1) remove itens raros, (2) ordena pelo rank da Tabela T.</div>
    <div class="card">
      <div class="card-label">Transações reordenadas</div>
      <table class="db-table">
        <tr><th>Trans.</th><th>Original</th><th style="width:16px"></th><th>Filtrado + ordenado</th></tr>
        ${ORDERED_TXS.map(t=>`<tr>
          <td style="color:var(--color-text-secondary);font-size:12px">${t.id}</td>
          <td>${chips(t.items)}</td>
          <td style="color:var(--color-text-tertiary)">→</td>
          <td>${chips(t.ordered)}</td>
        </tr>`).join('')}
      </table>
    </div>
  `},

  // Steps 4-11: Build FP-Tree transaction by transaction
  ...ORDERED_TXS.map((tx,ti)=>({
    phase:'FP-Tree',
    title:`Inserindo ${tx.id} na FP-Tree`,
    subtitle:`Transação filtrada: ${tx.ordered.join(' → ')}`,
    txIdx: ti,
    render: function(){return renderTree(ti);}
  })),

  // Step 12: Full tree
  {phase:'FP-Tree', title:'FP-Tree completa!', subtitle:'O banco inteiro comprimido em uma única estrutura',
  render:()=>`
    <div class="callout success">A FP-Tree está completa. O banco não será mais lido. Toda a informação necessária está nessa árvore!</div>
    ${renderTree(7, true)}
    <div class="callout">Próximo passo: minerar a árvore de baixo para cima, começando pelos itens com MENOR suporte.</div>
  `},

  // Step 13: Conditional patterns for Manteiga
  {phase:'Mineração', title:'Conjuntos condicionais — Manteiga', subtitle:'Quais caminhos levam até Manteiga na árvore?',
  render:()=>`
    <div class="callout">Olhamos para todos os nós "Manteiga" na árvore e coletamos o caminho da raiz até cada um deles.</div>
    <div class="two-col">
      <div class="card">
        <div class="card-label">Caminhos condicionais (prefixos)</div>
        <div style="font-size:13px;line-height:2">
          <div>${chip('Pão')} ${chip('Leite')} ${chip('Ovos')} → peso <strong>1</strong></div>
          <div>${chip('Pão')} ${chip('Ovos')} → peso <strong>1</strong></div>
          <div>${chip('Leite')} ${chip('Ovos')} → peso <strong>1</strong></div>
          <div>${chip('Leite')} → peso <strong>1</strong></div>
        </div>
      </div>
      <div class="card">
        <div class="card-label">Suporte de cada item nesses caminhos</div>
        <div style="font-size:13px;line-height:2">
          <div>${chip('Pão')} aparece 2× <span style="color:var(--color-text-secondary)">&lt; min ${MIN_SUP} ❌</span></div>
          <div>${chip('Leite')} aparece 3× <span style="color:var(--color-text-success)">≥ min ${MIN_SUP} ✅</span></div>
          <div>${chip('Ovos')} aparece 3× <span style="color:var(--color-text-success)">≥ min ${MIN_SUP} ✅</span></div>
        </div>
      </div>
    </div>
    <div class="callout">Suporte de {Leite, Manteiga} = 3 ✅ &nbsp;|&nbsp; Suporte de {Ovos, Manteiga} = 3 ✅ &nbsp;|&nbsp; Suporte de {Pão, Manteiga} = 2 ❌</div>
    <div class="callout success">Itemsets descobertos aqui: {Leite, Manteiga} e {Ovos, Manteiga}.</div>
    <div class="callout">{Ovos, Manteiga} vem diretamente dos caminhos condicionais: Ovos aparece 3 vezes nos prefixos → suporte 3.</div>
  `},

  // Step 14: Conditional ordering for Manteiga
  {phase:'Mineração', title:'Ordenação condicional — Manteiga', subtitle:'Tabela T condicional e prefixos ordenados',
  render:()=>`
    <div class="callout">Na base condicional de Manteiga, removemos Pão (suporte 2) e reordenamos por suporte.</div>
    <div class="two-col">
      <div class="card">
        <div class="card-label">Tabela T condicional</div>
        <div class="t-header"><span>Rank</span><span>Item</span><span>Suporte</span></div>
        ${COND_MANTEIGA_FREQUENT.map((item,i)=>`<div class="ordered-item">
          <div class="rank">${i+1}</div>
          ${chip(item)}
          <span style="margin-left:auto;font-size:12px;font-weight:500;color:var(--color-text-primary)">${COND_MANTEIGA_SUPPORT[item]}</span>
          <div style="height:8px;width:${COND_MANTEIGA_SUPPORT[item]*18}px;background:#B5D4F4;border-radius:4px"></div>
        </div>`).join('')}
      </div>
      <div class="card">
        <div class="card-label">Prefixos filtrados + ordenados</div>
        <table class="db-table">
          <tr><th>Prefixo</th><th>Peso</th><th>Ordenado</th></tr>
          ${COND_MANTEIGA_ORDERED.map(p=>`<tr>
            <td>${chips(p.items)}</td>
            <td style="color:var(--color-text-secondary)">${p.weight}</td>
            <td>${chips(p.ordered)}</td>
          </tr>`).join('')}
        </table>
      </div>
    </div>
    <div class="callout">Agora inserimos cada prefixo ordenado na árvore condicional, com o peso do caminho.</div>
  `},

  // Steps 15-18: Conditional tree insertion
  ...COND_MANTEIGA_ORDERED.map((tx,ti)=>({
    phase:'Mineração',
    title:`Inserindo prefixo ${ti+1} na árvore condicional`,
    subtitle:`Prefixo ordenado: ${tx.ordered.join(' → ') || '∅'} (peso ${tx.weight})`,
    txIdx: ti,
    render: function(){return renderConditionalInsertStep(ti);}
  })),

  // Step 19: Conditional tree final
  {phase:'Mineração', title:'Árvore condicional — Manteiga', subtitle:'Árvore final após todas as inserções',
  render:()=>`
    <div class="callout">Após todas as inserções, a árvore condicional resume a base em poucos nós.</div>
    <div class="card">
      <div class="card-label">FP-Tree condicional a {Manteiga}</div>
      ${renderConditionalInsertStep(COND_MANTEIGA_ORDERED.length-1, true)}
    </div>
    <div class="callout warn">A árvore tem ramificações (Leite e Ovos). Isso exige mais uma etapa recursiva.</div>
  `},

  // Step 20: Recursion item Ovos
  {phase:'Mineração', title:'Recursão 1 — item Ovos', subtitle:'Base condicional de {Manteiga, Ovos}',
  render:()=>`
    <div class="callout">Pegamos todos os caminhos que levam a Ovos na árvore condicional de Manteiga.</div>
    <div class="two-col">
      <div class="card">
        <div class="card-label">Caminhos condicionais</div>
        <div style="font-size:13px;line-height:2">
          ${COND_MANTEIGA_OVOS_PREFIXES.map(p=>`<div>${displayPrefix(p.items)} → peso <strong>${p.weight}</strong></div>`).join('')}
        </div>
      </div>
      <div class="card">
        <div class="card-label">Suporte na base condicional</div>
        <div style="font-size:13px;line-height:2">
          <div>${chip('Leite')} aparece ${COND_MANTEIGA_OVOS_SUPPORT.Leite}× <span style="color:var(--color-text-success)">≥ min ${MIN_SUP} ✅</span></div>
          <div style="color:var(--color-text-secondary)">Prefixo vazio não gera itens</div>
        </div>
      </div>
    </div>
    <div class="callout">Seguimos com Leite como único item frequente nessa base.</div>
  `},

  // Step 21: Conditional ordering for {Ovos, Manteiga}
  {phase:'Mineração', title:'Ordenação condicional — {Ovos, Manteiga}', subtitle:'Tabela T e prefixos ordenados',
  render:()=>`
    <div class="callout">Com a base condicional de Ovos, montamos a Tabela T e ordenamos os prefixos.</div>
    <div class="two-col">
      <div class="card">
        <div class="card-label">Tabela T condicional</div>
        <div class="t-header"><span>Rank</span><span>Item</span><span>Suporte</span></div>
        ${COND_MANTEIGA_OVOS_FREQUENT.map((item,i)=>`<div class="ordered-item">
          <div class="rank">${i+1}</div>
          ${chip(item)}
          <span style="margin-left:auto;font-size:12px;font-weight:500;color:var(--color-text-primary)">${COND_MANTEIGA_OVOS_SUPPORT[item]}</span>
          <div style="height:8px;width:${COND_MANTEIGA_OVOS_SUPPORT[item]*18}px;background:#B5D4F4;border-radius:4px"></div>
        </div>`).join('')}
      </div>
      <div class="card">
        <div class="card-label">Prefixos filtrados + ordenados</div>
        <table class="db-table">

// ---- FP-Tree rendering ----
// Pre-computed tree state after each transaction
const TREE_STATES = computeTreeStates();

function computeTreeStates(){
  const states=[];
  let tree={children:{}};
  for(let ti=0;ti<ORDERED_TXS.length;ti++){
    const tx=ORDERED_TXS[ti];
    insertIntoTree(tree, tx.ordered);
    states.push(JSON.parse(JSON.stringify(tree)));
  }
  return states;
}
function insertIntoTree(node,items){
  if(!items.length)return;
  const [head,...rest]=items;
  if(!node.children[head])node.children[head]={count:0,children:{}};
  node.children[head].count++;
  insertIntoTree(node.children[head],rest);
}

function insertWeightedIntoTree(node,items,weight){
  if(!items.length)return;
  const [head,...rest]=items;
  if(!node.children[head])node.children[head]={count:0,children:{}};
  node.children[head].count+=weight;
  insertWeightedIntoTree(node.children[head],rest,weight);
}

function treeNode(x,y,label,count,color){
  const r=20;
  const fill=color||'var(--color-background-secondary)';
  const stroke=color||'var(--color-border-secondary)';
  const tc=color?'#fff':'var(--color-text-primary)';
  const sc=color?'rgba(255,255,255,.8)':'var(--color-text-secondary)';
  return `
    <circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>
    <text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" style="font-size:11px;font-weight:500;fill:${tc}">${label}</text>
    ${count?`<text x="${x+r-2}" y="${y-r+2}" text-anchor="middle" dominant-baseline="central" style="font-size:9px;font-weight:500;fill:${color?color:'var(--color-text-info)'}">${count}</text>`:''}
  `;
}

function renderTreeSVG(treeState, highlightPath){
  // Layout: root at top, children spread below
  const nodes=[];
  const edges=[];
  function layout(node, x, y, spread, parentX, parentY, path){
    const keys=Object.keys(node.children);
    const color=COLORS[path[path.length-1]]||null;
    nodes.push({x,y,label:path.length?path[path.length-1]:'raiz',count:node.count||'',color});
    if(parentX!==null) edges.push({x1:parentX,y1:parentY,x2:x,y2:y});
    const n=keys.length;
    keys.forEach((key,i)=>{
      const cx=x+(i-(n-1)/2)*spread;
      layout(node.children[key],cx,y+70,Math.max(spread/2,55),x,y,[...path,key]);
    });
  }
  layout(treeState,240,28,220,null,null,[]);
  const maxY=nodes.reduce((m,n)=>Math.max(m,n.y),0)+50;
  return `<svg width="100%" viewBox="0 0 480 ${maxY}" style="overflow:visible">
    <defs><marker id="atree" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
    ${edges.map(e=>`<line x1="${e.x1}" y1="${e.y1+20}" x2="${e.x2}" y2="${e.y2-20}" stroke="var(--color-border-secondary)" stroke-width="1" marker-end="url(#atree)" fill="none"/>`).join('')}
    ${nodes.map(n=>treeNode(n.x,n.y,n.label,n.count,n.color)).join('')}
  </svg>`;
}

function computeWeightedTreeStatesFrom(orderedList){
  const states=[];
  let tree={children:{}};
  for(let ti=0;ti<orderedList.length;ti++){
    const tx=orderedList[ti];
    insertWeightedIntoTree(tree, tx.ordered, tx.weight);
    states.push(JSON.parse(JSON.stringify(tree)));
  }
  return states;
}

const COND_MANTEIGA_TREE_STATES=computeWeightedTreeStatesFrom(COND_MANTEIGA_ORDERED);
const COND_MANTEIGA_OVOS_TREE_STATES=computeWeightedTreeStatesFrom(COND_MANTEIGA_OVOS_ORDERED);

function renderTree(txIdx, full=false){
  const state=TREE_STATES[txIdx];
  const tx=ORDERED_TXS[txIdx];
  return `
    <div class="two-col">
      <div class="card">
        <div class="card-label">FP-Tree após ${full?'todas as transações':tx.id}</div>
        ${renderTreeSVG(state)}
      </div>
      <div class="card">
        <div class="card-label">${full?'Transações inseridas':'Inserindo agora'}</div>
        <table class="db-table">
          ${ORDERED_TXS.slice(0,full?undefined:txIdx+1).map((t,i)=>`
            <tr class="${!full&&i===txIdx?'highlight':''}">
              <td style="font-size:11px;color:var(--color-text-secondary)">${t.id}</td>
              <td>${chips(t.ordered)}</td>
            </tr>`).join('')}
        </table>
        ${!full?`<div style="margin-top:8px;font-size:12px;color:var(--color-text-secondary)">Caminho: <strong style="color:var(--color-text-primary)">${tx.ordered.join(' → ')}</strong></div>`:''}
      </div>
    </div>
    ${!full&&tx.ordered.length>1?`<div class="callout">Prefixo compartilhado: transações com mesmo início <strong>compartilham nós</strong>, economizando memória.</div>`:''}
  `;
}

// ---- Phase pills ----
const phases=[...new Set(STEPS.map(s=>s.phase))];
function renderPhaseBar(){
  const cur=STEPS[stepIdx].phase;
  document.getElementById('phase-bar').innerHTML=phases.map(p=>`<div class="phase-pill ${p===cur?'active':''}" onclick="jumpToPhase('${p}')">${p}</div>`).join('');
}

function jumpToPhase(ph){
  const idx=STEPS.findIndex(s=>s.phase===ph);
  if(idx>=0){stepIdx=idx;render();}
}

function render(){
  const s=STEPS[stepIdx];
  document.getElementById('step-content').innerHTML=`
    <div class="step-header">
      <div class="step-badge">${stepIdx+1}</div>
      <div><div class="step-title">${s.title}</div><div class="step-subtitle">${s.subtitle}</div></div>
    </div>
    ${s.render()}
  `;
  document.getElementById('btn-prev').disabled=stepIdx===0;
  document.getElementById('btn-next').disabled=stepIdx===STEPS.length-1;
  document.getElementById('btn-next').textContent=stepIdx===STEPS.length-1?'Concluído ✓':'Próximo →';
  document.getElementById('step-counter').textContent=`${stepIdx+1} / ${STEPS.length}`;
  renderPhaseBar();
}

function navigate(dir){
  stepIdx=Math.max(0,Math.min(STEPS.length-1,stepIdx+dir));
  render();
}

render();
